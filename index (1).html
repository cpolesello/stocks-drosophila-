<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocks Drosophila — Phase 2 (synchro temps réel)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111827; }
  header { background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
  .stats { display: flex; gap: 12px; font-size: 13px; }
  .stats b { font-size: 15px; }
  .ok { color: #16a34a; } .lost { color: #dc2626; }
  button { cursor: pointer; border: none; border-radius: 8px; font-size: 13px; padding: 8px 12px; font-weight: 500; }
  .btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #e5e7eb; color: #111; } .btn-secondary:hover { background: #d1d5db; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-edit { background: transparent; color: #2563eb; padding: 4px 8px; } .btn-edit:hover { background: #dbeafe; }
  .btn-del { background: transparent; color: #dc2626; padding: 4px 8px; } .btn-del:hover { background: #fee2e2; }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters input, .filters select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; }
  .filters input { flex: 1; min-width: 180px; }
  .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f9fafb; text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; color: #6b7280; white-space: nowrap; cursor: pointer; }
  td { padding: 8px 12px; border-top: 1px solid #f3f4f6; vertical-align: middle; }
  tr:hover td { background: #eff6ff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: #dcfce7; color: #15803d; } .badge-lost { background: #fee2e2; color: #b91c1c; }
  .badge-other { background: #f3f4f6; color: #4b5563; } .badge-none { color: #d1d5db; }
  .mono { font-family: ui-monospace, monospace; font-weight: 600; white-space: nowrap; }
  .truncate { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footer-note { font-size: 11px; color: #9ca3af; margin-top: 8px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 20px; }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 3px; }
  .form-grid input, .form-grid textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; font-family: inherit; }
  .form-grid .full { grid-column: 1 / -1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #loginScreen { max-width: 360px; margin: 80px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; text-align: center; }
  #loginScreen h1 { margin: 0 0 8px; font-size: 20px; }
  #loginScreen p { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
  #syncStatus { font-size: 11px; color: #6b7280; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } h1 { font-size: 16px; } }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🪰 Stocks Drosophila</h1>
  <p>Connecte-toi avec ton compte Google pour accéder à la base partagée.</p>
  <button class="btn-primary" style="width:100%;padding:12px" onclick="login()">Se connecter avec Google</button>
</div>

<div id="appScreen" style="display:none">
  <header>
    <div class="header-inner">
      <h1>🪰 Stocks Drosophila</h1>
      <span id="syncStatus">🔄 synchro...</span>
      <div class="stats">
        <span><b id="statTotal">0</b> stocks</span>
        <span class="ok"><b id="statOk">0</b> OK</span>
        <span class="lost"><b id="statLost">0</b> Lost</span>
      </div>
      <button class="btn-primary" onclick="openModal(null)">+ Nouveau</button>
      <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Importer CSV</button>
      <button class="btn-secondary" onclick="exportCSV()">Exporter CSV</button>
      <button class="btn-secondary" onclick="logout()">Déconnexion</button>
      <input id="fileInput" type="file" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>
  </header>
  <div class="container">
    <div class="filters">
      <input id="search" placeholder="Rechercher..." oninput="render()">
      <select id="filterCat" onchange="render()"><option value="">Toutes catégories</option></select>
      <select id="filterLoc" onchange="render()"><option value="">Toutes localisations</option></select>
      <select id="filterState" onchange="render()"><option value="">Tous états</option></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="sortBy('Name')">Name</th><th onclick="sortBy('Gene')">Gene</th><th onclick="sortBy('Category')">Category</th>
          <th onclick="sortBy('Genotype')">Genotype</th><th onclick="sortBy('Chr')">Chr</th><th onclick="sortBy('Location')">Location</th>
          <th onclick="sortBy('state')">State</th><th style="text-align:right">Actions</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="footer-note" id="countNote"></p>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2 id="modalTitle">Nouveau stock</h2>
    <div class="form-grid" id="formGrid"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="saveStock()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="deleteOverlay" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:380px">
    <h2>Supprimer <span id="deleteName"></span> ?</h2>
    <p id="deleteInfo" style="font-size:13px;color:#6b7280;margin-bottom:8px"></p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="document.getElementById('deleteOverlay').style.display='none'">Annuler</button>
      <button class="btn-danger" onclick="confirmDelete()">Supprimer</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// Config Firebase du projet drosostockscpv1
const firebaseConfig = {
  apiKey: "AIzaSyCBDSr_crY_8XzQPm2fr4DfFTuQ2Q9dSXg",
  authDomain: "drosostockscpv1.firebaseapp.com",
  projectId: "drosostockscpv1",
  storageBucket: "drosostockscpv1.firebasestorage.app",
  messagingSenderId: "200703310631",
  appId: "1:200703310631:web:ae1298066f41a6cf6dc702",
  measurementId: "G-5PM3ZGPJ2H"
};

const COLUMNS = ["Name","Gene","Category","Genotype","Chr","Sources","Comments","Location","Refs","Ref_DOI","state"];
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let stocks = [];
let sortCol = "Name", sortAsc = true;
let editingId = null;
let deleteId = null;

window.login = () => signInWithPopup(auth, new GoogleAuthProvider());
window.logout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appScreen").style.display = "block";
    onSnapshot(collection(db, "stocks"), snap => {
      stocks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById("syncStatus").textContent = "🟢 synchronisé (" + new Date().toLocaleTimeString() + ")";
      fillFilters(); render();
    }, err => { document.getElementById("syncStatus").textContent = "🔴 erreur: " + err.message; });
  } else {
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("appScreen").style.display = "none";
  }
});

function parseCSV(text) {
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field.trim()); field = ""; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field.trim()); field = "";
        if (row.length > 1 && row.some(x => x !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== "" || row.length > 0) { row.push(field.trim()); if (row.some(x => x !== "")) rows.push(row); }
  if (!rows.length) return [];
  const h = rows[0];
  return rows.slice(1).map(r => { const o = {}; h.forEach((k,i) => o[k] = (r[i]||"").trim()); return o; });
}
function toCSV(data) {
  const esc = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return COLUMNS.map(esc).join(",") + "\n" + data.map(d => COLUMNS.map(c => esc(d[c])).join(",")).join("\n");
}
function badge(state) {
  const s = (state||"").toLowerCase();
  if (s.includes("lost")) return '<span class="badge badge-lost">Lost</span>';
  if (s.includes("ok")) return '<span class="badge badge-ok">OK</span>';
  if (s) return '<span class="badge badge-other">' + escapeHtml(state) + '</span>';
  return '<span class="badge-none">—</span>';
}
function escapeHtml(s) { return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function sortBy(col) { if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; } render(); }
window.sortBy = sortBy;

function filtered() {
  const q = document.getElementById("search").value.toLowerCase();
  const fc = document.getElementById("filterCat").value;
  const fl = document.getElementById("filterLoc").value;
  const fs = document.getElementById("filterState").value;
  return stocks.filter(s => {
    if (q && !COLUMNS.some(c => (s[c]||"").toLowerCase().includes(q))) return false;
    if (fc && s.Category !== fc) return false;
    if (fl && s.Location !== fl) return false;
    if (fs && s.state !== fs) return false;
    return true;
  }).sort((a,b) => {
    const va = (a[sortCol]||""), vb = (b[sortCol]||"");
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });
}

function render() {
  const data = filtered();
  document.getElementById("tbody").innerHTML = data.length ? data.map(s => `
    <tr>
      <td class="mono">${escapeHtml(s.Name)}</td>
      <td>${escapeHtml(s.Gene)}</td>
      <td style="white-space:nowrap">${escapeHtml(s.Category)}</td>
      <td class="truncate" title="${escapeHtml(s.Genotype)}">${escapeHtml(s.Genotype)}</td>
      <td>${escapeHtml(s.Chr)}</td>
      <td style="white-space:nowrap">${escapeHtml(s.Location)}</td>
      <td>${badge(s.state)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn-edit" onclick="openModal('${s.id}')">Éditer</button>
        <button class="btn-del" onclick="askDelete('${s.id}')">Suppr.</button>
      </td>
    </tr>`).join("") : '<tr><td colspan="8" style="text-align:center;padding:32px;color:#9ca3af">Aucun stock trouvé</td></tr>';
  document.getElementById("countNote").textContent = data.length + " / " + stocks.length + " stocks affichés";
  document.getElementById("statTotal").textContent = stocks.length;
  document.getElementById("statOk").textContent = stocks.filter(s => (s.state||"").toLowerCase().includes("ok")).length;
  document.getElementById("statLost").textContent = stocks.filter(s => (s.state||"").toLowerCase().includes("lost")).length;
}

function fillFilters() {
  const uniq = col => [...new Set(stocks.map(s => s[col]).filter(Boolean))].sort();
  const setSel = (id, vals) => { const el = document.getElementById(id); const cur = el.value; el.innerHTML = el.options[0].outerHTML + vals.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join(""); el.value = cur; };
  setSel("filterCat", uniq("Category"));
  setSel("filterLoc", uniq("Location"));
  setSel("filterState", uniq("state"));
}

const EMPTY = Object.fromEntries(COLUMNS.map(c => [c, ""]));
window.openModal = (id) => {
  editingId = id;
  const d = id ? stocks.find(s => s.id === id) : {...EMPTY};
  document.getElementById("modalTitle").textContent = id ? "Modifier " + d.Name : "Nouveau stock";
  document.getElementById("formGrid").innerHTML = COLUMNS.map(col => {
    const full = (col === "Genotype" || col === "Comments") ? "full" : "";
    const inner = (col === "Genotype" || col === "Comments")
      ? `<textarea rows="2" data-col="${col}">${escapeHtml(d[col]||"")}</textarea>`
      : `<input data-col="${col}" value="${escapeHtml(d[col]||"")}">`;
    return `<div class="${full}"><label>${col}</label>${inner}</div>`;
  }).join("");
  document.getElementById("modalOverlay").style.display = "flex";
};
window.closeModal = () => { document.getElementById("modalOverlay").style.display = "none"; editingId = null; };

window.saveStock = async () => {
  const d = {};
  document.querySelectorAll("#formGrid [data-col]").forEach(el => d[el.dataset.col] = el.value);
  if (!d.Name.trim()) { alert("Le champ Name est obligatoire"); return; }
  if (editingId) await updateDoc(doc(db, "stocks", editingId), d);
  else await addDoc(collection(db, "stocks"), d);
  window.closeModal();
};

window.askDelete = (id) => { deleteId = id; const s = stocks.find(x => x.id === id); document.getElementById("deleteName").textContent = s.Name; document.getElementById("deleteInfo").textContent = s.Gene + " — " + s.Genotype; document.getElementById("deleteOverlay").style.display = "flex"; };
window.confirmDelete = async () => { await deleteDoc(doc(db, "stocks", deleteId)); document.getElementById("deleteOverlay").style.display = "none"; deleteId = null; };

window.exportCSV = () => {
  const blob = new Blob([toCSV(stocks)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Stock_CP_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
};

window.importCSV = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    const rows = parseCSV(String(r.result));
    for (const row of rows) {
      if (row.Name && !stocks.some(s => s.Name === row.Name)) await addDoc(collection(db, "stocks"), row);
    }
  };
  r.readAsText(f); e.target.value = "";
};
</script>

</body>
